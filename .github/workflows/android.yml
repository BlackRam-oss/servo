name: Build Android native WebView APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Bundle smoke-test content
        run: |
          mkdir -p support/android/apk/servoapp/src/main/assets/www
          cp -r test-page/public/. support/android/apk/servoapp/src/main/assets/www/
          cat > support/android/apk/servoapp/src/main/assets/www/index.html <<'HTML'
          <!doctype html><html><body><h1>Roves native WebView</h1><script>
          localStorage.setItem('roves-smoke', 'ok');
          fetch('/favicon.svg').then(r => { if (!r.ok) throw Error(r.status); return r.text(); })
            .then(() => document.body.append('Local assets and storage ready'));
          </script></body></html>
          HTML
      - name: Build without Servo or NDK
        working-directory: support/android/apk
        run: ./gradlew --no-daemon :servoapp:assembleArm64Debug
      - uses: actions/upload-artifact@v4
        with:
          name: roves-android-webview
          path: support/android/apk/servoapp/build/outputs/apk/**/*.apk
